name: Deploy to EC2

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build client
        run: |
          cd client
          npm ci
          npm run build

      - name: Build server
        run: |
          cd server
          npm ci
          npm run build

      - name: Create deployment package
        run: |
          mkdir -p deploy
          cp -r server/dist deploy/
          cp -r server/package.json deploy/
          cp -r server/package-lock.json deploy/
          cp -r client/dist deploy/client
          cp -r shared deploy/
          cp -r node_modules deploy/
          cp ecosystem.config.js deploy/ 2>/dev/null || true
          cp nginx.conf deploy/ 2>/dev/null || true
          cd deploy
          tar -czf ../foodiefinds-deploy.tar.gz .
          cd ..

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_PEM_KEY }}" > ~/.ssh/ubuntunew.pem
          chmod 600 ~/.ssh/ubuntunew.pem
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to EC2
        run: |
          scp -i ~/.ssh/ubuntunew.pem foodiefinds-deploy.tar.gz ubuntu@${{ secrets.EC2_HOST }}:/tmp/
          ssh -i ~/.ssh/ubuntunew.pem ubuntu@${{ secrets.EC2_HOST }} << 'ENDSSH'
            # Create app directory if it doesn't exist
            sudo mkdir -p /var/www/foodiefinds
            sudo chown ubuntu:ubuntu /var/www/foodiefinds
            
            # Backup current deployment
            if [ -d "/var/www/foodiefinds/current" ]; then
              sudo mv /var/www/foodiefinds/current /var/www/foodiefinds/backup-$(date +%Y%m%d-%H%M%S)
            fi
            
            # Extract new deployment
            mkdir -p /var/www/foodiefinds/current
            tar -xzf /tmp/foodiefinds-deploy.tar.gz -C /var/www/foodiefinds/current
            
            # Install dependencies
            cd /var/www/foodiefinds/current
            npm install --production
            
            # Setup nginx
            if [ -f "nginx.conf" ]; then
              sudo cp nginx.conf /etc/nginx/sites-available/foodiefinds
              sudo ln -sf /etc/nginx/sites-available/foodiefinds /etc/nginx/sites-enabled/
              sudo nginx -t && sudo systemctl reload nginx
            fi
            
            # Restart application with PM2
            if command -v pm2 &> /dev/null; then
              if [ -f "ecosystem.config.js" ]; then
                pm2 reload ecosystem.config.js || pm2 start ecosystem.config.js
              else
                pm2 restart foodiefinds || pm2 start dist/index.js --name foodiefinds
              fi
            else
              echo "PM2 not found, please install it: npm install -g pm2"
            fi
            
            # Cleanup
            rm /tmp/foodiefinds-deploy.tar.gz
          ENDSSH

      - name: Cleanup SSH
        if: always()
        run: |
          rm -f ~/.ssh/ubuntunew.pem
